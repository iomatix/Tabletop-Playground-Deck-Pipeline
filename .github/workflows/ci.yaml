name: CI & Release Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Tests & Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Execute Static Analysis (Ruff)
        run: |
          ruff check .

      - name: Execute Pytest
        run: |
          pytest -v tests/

  build-release-artifacts:
    name: Build Release Artifacts (Windows EXE & Source ZIP)
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile Executable via PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --console `
            --name "TTPG-Deck-Pipeline" `
            --add-data "locales;locales" `
            --hidden-import deck_processor `
            --hidden-import ttpg_packager `
            --collect-all nicegui `
            gui_app.py   
          Copy-Item "config.json" -Destination "dist/TTPG-Deck-Pipeline/config.json"
          New-Item -ItemType Directory -Force -Path "dist/TTPG-Deck-Pipeline/_INPUT"
          New-Item -ItemType Directory -Force -Path "dist/TTPG-Deck-Pipeline/_OUTPUT"
          New-Item -ItemType Directory -Force -Path "dist/TTPG-Deck-Pipeline/_PACKAGE"

      - name: Compress Build Artifacts
        run: |
          # 1. Standalone Windows executable
          Compress-Archive -Path dist/TTPG-Deck-Pipeline -DestinationPath dist/TTPG-Deck-Pipeline-Windows.zip

          # 2. Source code package (clean, portable)
          git archive --format=zip --output=dist/TTPG-Deck-Pipeline-Source.zip HEAD

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TTPG-Deck-Pipeline-Windows.zip
            dist/TTPG-Deck-Pipeline-Source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}