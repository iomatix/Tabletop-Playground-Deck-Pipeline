name: CI & Release Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Tests & Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Execute Static Analysis (Ruff)
        run: |
          ruff check .

      - name: Execute Pytest
        run: |
          pytest -v tests/

  build-windows-exe:
    name: Build Standalone Windows Executable
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile Executable via PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "TTPG-Deck-Pipeline" `
            --add-data "locales;locales" `
            --add-data "config.json;." `
            --collect-all nicegui `
            gui_app.py

      - name: Compress Build Artifact
        run: |
          Compress-Archive -Path dist/TTPG-Deck-Pipeline -DestinationPath dist/TTPG-Deck-Pipeline-Windows.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TTPG-Deck-Pipeline-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}